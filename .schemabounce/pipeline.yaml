apiVersion: schemabounce.com/v1
kind: RepoPipeline
pipeline:
  - name: breakdown
    uses: plan
    maxUnits: 1
    guidance: Plan exactly one unit that adds a Usage section to NOTES.md. Its acceptance criterion cites the unit-suite check.
  - forEach: breakdown.units
    steps:
      - uses: implement
  - name: unit-suite
    uses: check
    commands:
      - { name: suite, run: sh tests/run.sh, severity: blocking }
  - name: outside-eyes
    uses: review
    context: fresh
    engine: codex
    model: gpt-5.4-nano
    criteria:
      - { name: notes-updated, threshold: 0.5 }
complete:
  endpoint: branch

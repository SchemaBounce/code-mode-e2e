apiVersion: schemabounce.com/v1
kind: RepoPipeline

# Live proof of dec-281: a read-only session changes nothing, so the check
# limited to paths nobody touched must be skipped with reason no_changes.
pipeline:
  - name: validate
    uses: check
    commands:
      - name: scoped
        run: "exit 1"
        severity: blocking
        when: { paths: ["code-sandbox-runner/**"] }
complete:
  endpoint: branch

apiVersion: schemabounce.com/v1
kind: RepoPipeline
pipeline:
  - name: breakdown
    uses: plan
    maxUnits: 2
    guidance: Plan exactly two units. Unit one edits NOTES.md. Unit two only adds docs/usage.md and has docsOnly true.
  - forEach: breakdown.units
    steps:
      - name: detail
        uses: plan
        maxUnits: 2
        guidance: Break this one unit into exactly two small sub-steps, each with one acceptance criterion.
      - name: unit-sign-off
        uses: approval
        reads: [detail]
      - uses: implement
      - name: unit-check
        uses: check
        commands:
          - { name: notes-exist, run: sh tests/notes_exist.sh, severity: blocking }
  - name: unit-suite
    uses: check
    commands:
      - { name: suite, run: sh tests/run.sh, severity: blocking }
  - name: heading
    uses: check
    commands:
      - { name: heading, run: sh tests/notes_heading.sh, severity: blocking }
complete:
  endpoint: branch

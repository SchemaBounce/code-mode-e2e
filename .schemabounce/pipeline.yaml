apiVersion: schemabounce.com/v1
kind: RepoPipeline
setup:
  - { name: deps, run: "mkdir -p node_modules/dep && echo cached > node_modules/dep/index.js" }
pipeline:
  - name: one
    uses: turn
    guidance: Reply with the single word one. Do not read or change any files.
  - name: two
    uses: turn
    guidance: Reply with the single word two. Do not read or change any files.
  - name: gate
    uses: check
    commands:
      - { name: always-fails, run: "exit 1", severity: blocking }
complete:
  endpoint: branch

apiVersion: schemabounce.com/v1
kind: RepoPipeline
pipeline:
  - name: implement
    uses: implement
  - name: validate
    uses: check
    commands:
      - name: syntax
        run: python3 -c "print('ok')"
        severity: blocking
        timeout: 2m
  - name: sign-off
    uses: approval
    reads: [implement]
complete:
  endpoint: branch

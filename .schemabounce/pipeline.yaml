apiVersion: schemabounce.com/v1
kind: RepoPipeline
pipeline:
  - name: breakdown
    uses: plan
    maxUnits: 3
    guidance: Plan at most three small units. Each unit edits NOTES.md or adds one file under docs/.
  - name: sign-off
    uses: approval
    reads: [breakdown]
  - forEach: breakdown.units
    steps:
      - uses: implement
      - name: unit-check
        uses: check
        commands:
          - { name: notes-exist, run: sh tests/notes_exist.sh, severity: blocking }
  - name: unit-suite
    uses: check
    commands:
      - { name: suite, run: sh tests/run.sh, severity: blocking }
  - name: heading
    uses: check
    commands:
      - { name: heading, run: sh tests/notes_heading.sh, severity: blocking }
  - name: self-check
    uses: review
    criteria:
      - { name: notes-updated, threshold: 0.5, blocking: false }
complete:
  endpoint: branch

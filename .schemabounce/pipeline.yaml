apiVersion: schemabounce.com/v1
kind: RepoPipeline
pipeline:
  - uses: implement
  - name: unit-suite
    uses: check
    commands:
      - { name: suite, run: sh tests/run.sh, severity: blocking }
  - name: licensed-eyes
    uses: review
    context: fresh
    engine: claude-code
    model: claude-haiku-4-5-20251001
    criteria:
      - { name: notes-updated, threshold: 0.5 }
complete:
  endpoint: branch

apiVersion: schemabounce.com/v1
kind: RepoPipeline
pipeline:
  - name: edit
    uses: implement
  - name: suite
    uses: check
    commands:
      - { name: suite, run: sh tests/run.sh, severity: blocking }
  - name: tidy
    uses: turn
    guidance: Append one more short line to NOTES.md saying the notes were tidied, then stop.
complete:
  endpoint: branch

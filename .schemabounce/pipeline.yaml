apiVersion: schemabounce.com/v1
kind: RepoPipeline
pipeline:
  - uses: implement
  - name: unit-suite
    uses: check
    commands:
      - { name: suite, run: sh tests/run.sh, severity: blocking }
  - name: outside-eyes
    uses: review
    context: fresh
    engine: codex
    model: gpt-4.1-mini
    criteria:
      - { name: notes-updated, threshold: 0.5 }
complete:
  endpoint: branch

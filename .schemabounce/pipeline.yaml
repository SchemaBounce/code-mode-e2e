apiVersion: schemabounce.com/v1
kind: RepoPipeline
pipeline:
  - name: implement
    uses: implement
  - name: validate
    uses: check
    onFail:
      retry: { maxAttempts: 1 }
      then: fail
    commands:
      - name: syntax
        run: python3 -m py_compile src/app.py
        severity: blocking
        timeout: 2m
complete:
  endpoint: branch

apiVersion: schemabounce.com/v1
kind: RepoPipeline
pipeline:
  - uses: implement
  - name: image-check
    uses: check
    commands:
      - name: toolchain
        severity: blocking
        run: python3 -c 'import sys; assert sys.version_info[:2] == (3, 12), sys.version; print("python", sys.version.split()[0])'

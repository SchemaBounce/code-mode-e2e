apiVersion: schemabounce.com/v1
kind: RepoPipeline
pipeline:
  - uses: implement
  - name: memhold-check
    uses: check
    commands:
      - name: memhold
        severity: blocking
        run: |-
          python3 -c "import time; b=bytearray(880*1024*1024); b[::4096]=b'x'*len(b[::4096]); time.sleep(20)"

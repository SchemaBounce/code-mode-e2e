apiVersion: schemabounce.com/v1
kind: RepoPipeline
pipeline:
  - name: implement
    uses: implement
  - name: validate
    uses: check
    onFail:
      retry: { maxAttempts: 1 }
      then: fail
    commands:
      - name: syntax
        run: test -f src/app.py
        severity: blocking
        timeout: 2m
  - name: sign-off
    uses: approval
complete:
  endpoint: branch
